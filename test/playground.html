<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Typer playground</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; }
    textarea, input, [contenteditable] { width: 100%; box-sizing: border-box; font: inherit; padding: 8px;
      border: 1px solid #aaa; border-radius: 6px; margin-bottom: 16px; }
    textarea { height: 180px; }
    [contenteditable] { min-height: 140px; }
    iframe { width: 100%; height: 170px; border: 1px solid #aaa; border-radius: 6px; }
    #log { font: 12px ui-monospace, monospace; background: #f4f4f5; padding: 8px; border-radius: 6px;
      height: 120px; overflow: auto; white-space: pre; }
  </style>
</head>
<body>
  <h1>Typer playground</h1>
  <p>Click a field, then press Alt+Shift+Y or use the popup. The log shows the events each field receives.</p>

  <h3>textarea</h3>
  <textarea id="ta"></textarea>

  <h3>input</h3>
  <input id="in" type="text">

  <h3>contenteditable</h3>
  <div id="ce" contenteditable="true"></div>

  <h3>contenteditable inside an iframe</h3>
  <iframe srcdoc="<body contenteditable style='font:14px system-ui;margin:8px'></body>"></iframe>

  <h3>Event log</h3>
  <div id="log"></div>

  <script>
    const log = document.getElementById('log');
    const counts = {};
    function track(el, name) {
      for (const type of ['keydown', 'keyup', 'beforeinput', 'input']) {
        el.addEventListener(type, (e) => {
          counts[name + ' ' + type] = (counts[name + ' ' + type] || 0) + 1;
          if (type === 'beforeinput') {
            log.textContent += `${name} ${e.inputType} ${JSON.stringify(e.data)}\n`;
            log.scrollTop = log.scrollHeight;
          }
        });
      }
    }
    track(document.getElementById('ta'), 'textarea');
    track(document.getElementById('in'), 'input');
    track(document.getElementById('ce'), 'editable');
  </script>
</body>
</html>
